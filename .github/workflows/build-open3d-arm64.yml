name: build-open3d-019-arm64-py38

# 为 OrangePi5 (aarch64 / Ubuntu 20.04 / Python 3.8) 构建 Open3D 0.19.0 wheel。
# v0.19.0 官方无 ARM64 wheel（bug #7130：aarch64 静态 libgfortran 未 -fPIC →
# import 报 "cannot allocate memory in static TLS block"）。本 workflow 先打上
# 官方修复 PR #7271 的补丁，再用官方 docker 配方（base arm64v8/ubuntu:20.04）构建，
# 并在干净的 arm64 ubuntu:20.04 + py3.8 容器里真 import 验证后再产出 wheel。

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04-arm      # 原生 aarch64 runner，公开仓库免费
    timeout-minutes: 300
    steps:
      - name: Checkout this repo (patch + smoke.py)
        uses: actions/checkout@v4

      - name: Confirm native aarch64
        run: uname -m

      - name: Clone Open3D v0.19.0
        run: |
          git clone --recursive --branch v0.19.0 --depth 1 \
            https://github.com/isl-org/Open3D.git open3d-src

      - name: Apply ARM64 fix patch (upstream PR #7271)
        run: |
          cd open3d-src
          patch -p1 < ../open3d-arm64-fix.patch

      - name: Work around Anaconda channel ToS in Open3D Dockerfile
        run: |
          cd open3d-src
          # Anaconda（2025 起）要求非交互接受默认频道 ToS，v0.19.0 的 Dockerfile 早于此改动
          sed -i '/^RUN conda create -y -n open3d/i RUN conda tos accept --override-channels --channel https://repo.anaconda.com/pkgs/main --channel https://repo.anaconda.com/pkgs/r || true' docker/Dockerfile.openblas
          sed -i '/^RUN conda tos accept/i ENV CONDA_PLUGINS_AUTO_ACCEPT_TOS=yes' docker/Dockerfile.openblas
          grep -n -B1 -A2 "CONDA_PLUGINS_AUTO_ACCEPT_TOS" docker/Dockerfile.openblas

      - name: Build ARM64 + py3.8 wheel (official openblas-arm64-py38 recipe)
        run: |
          cd open3d-src
          ./docker/docker_build.sh openblas-arm64-py38
          ls -lh ./*.whl

      - name: Smoke test import in clean arm64 ubuntu:20.04 + py3.8
        run: |
          WHL=$(basename $(ls open3d-src/*.whl))
          docker run --rm -v "$PWD:/w" arm64v8/ubuntu:20.04 bash -c "
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq python3 python3-pip libgfortran5 libgomp1 >/dev/null
            python3 -m pip install --quiet --upgrade pip
            python3 -m pip install --quiet /w/open3d-src/$WHL
            python3 /w/smoke.py
          "

      - name: Upload wheel
        if: always()      # 即使冒烟测试失败也保留 wheel，便于取回
        uses: actions/upload-artifact@v4
        with:
          name: open3d-0.19.0-cp38-aarch64-wheel
          path: open3d-src/*.whl
          if-no-files-found: error
